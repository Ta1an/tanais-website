
name: Deploy to Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hosting-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Nuxt site
        run: npm run generate

      - name: Publish hosting branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          mkdir -p /tmp/hosting

          if git ls-remote --exit-code --heads origin hosting; then
            git fetch origin hosting
            git worktree add -B hosting /tmp/hosting origin/hosting
          else
            git worktree add --detach /tmp/hosting
            git -C /tmp/hosting checkout --orphan hosting
          fi

          rsync -a --delete --exclude='.git' \
            .output/public/ /tmp/hosting/

          cd /tmp/hosting
          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Deploy ${GITHUB_SHA}"
            git push origin hosting
          fi
